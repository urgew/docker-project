
name: Deploy to Kubernetes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'kubernetes-yml-files/**'
      - '.github/workflows/deploy-kubernetes.yaml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check kubectl
        run: kubectl version --client

      - name: Verify Kubernetes connection
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Validate manifests
        run: kubectl apply --dry-run=server -f ./kubernetes-yml-files/

      - name: Deploy to Kubernetes
        run: kubectl apply -f ./kubernetes-yml-files/

      - name: Verify deployment
        run: kubectl get deployments,services,ingresses -A
